services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
    environment:
      APP__ENV: prod
      APP__LOG_LEVEL: INFO
      APP__SECRET_KEY: change_this_to_a_secure_key
      APP__ALGORITHM: HS256
      APP__ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      DATABASE__ENGINE: sqlite
      DATABASE__DB: /data/ollama-hack.db
    volumes:
      - ./data:/data
    restart: unless-stopped
